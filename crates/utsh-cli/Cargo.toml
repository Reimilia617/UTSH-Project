[package]
name = "utsh-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The `utsh` command line tool: plugin/theme/alias management, status & doctor diagnostics, WebUI launcher."

# 产出名为 `utsh` 的可执行文件（crate 名保持 utsh-cli）。
[[bin]]
name = "utsh"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
utsh-core = { workspace = true }
